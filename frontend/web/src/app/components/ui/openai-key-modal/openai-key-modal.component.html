<div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Configure OpenAI API Key</h2>
            <button class="close-btn" (click)="onClose()">&times;</button>
        </div>

        <div class="modal-body">
            <p class="description">
                Enter your OpenAI API key to access GPT models. Your key is stored locally in your browser.
            </p>

            <div class="input-group">
                <label for="apiKey">API Key</label>
                <div class="key-input-wrapper">
                    <input id="apiKey" [type]="showKey ? 'text' : 'password'" [(ngModel)]="apiKey" placeholder="sk-..."
                        class="api-key-input" />
                    <button class="toggle-visibility" (click)="toggleShowKey()" type="button">
                        {{ showKey ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <div class="info-box">
                <span class="info-icon">ℹ️</span>
                <span>Get your API key from <a href="https://platform.openai.com/api-keys" target="_blank"
                        rel="noopener">OpenAI Platform</a></span>
            </div>
        </div>

        <div class="modal-footer">
            <button class="cancel-btn" (click)="onClose()">Cancel</button>
            <button class="save-btn" (click)="saveKey()" [disabled]="!apiKey.trim() || isSaving">
                {{ isSaving ? 'Saving...' : 'Save & Connect' }}
            </button>
        </div>
    </div>
</div>
