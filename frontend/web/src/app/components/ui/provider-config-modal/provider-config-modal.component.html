<div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Provider Configuration</h2>
            <button class="close-btn" (click)="onClose()">✕</button>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-bar">
            <button class="tab-btn" [class.active]="activeTab === 'offline'" (click)="switchTab('offline')">
                🖥️ Offline
            </button>
            <button class="tab-btn" [class.active]="activeTab === 'online'" (click)="switchTab('online')">
                ☁️ Online
            </button>
        </div>

        <div class="modal-body">
            <!-- Offline Tab -->
            <div *ngIf="activeTab === 'offline'" class="tab-content">
                <div class="config-section">
                    <label class="config-label">
                        <span class="label-icon">🦙</span>
                        Ollama Base URL
                    </label>
                    <p class="config-description">
                        Enter the base URL for your Ollama server. Default is localhost.
                    </p>
                    <input #ollamaUrlInput type="text" [(ngModel)]="ollamaBaseUrl" class="config-input"
                        placeholder="http://localhost:11434" />
                </div>
            </div>

            <!-- Online Tab -->
            <div *ngIf="activeTab === 'online'" class="tab-content">
                <div class="config-section">
                    <label class="config-label">
                        <span class="label-icon">🔑</span>
                        OpenAI API Key
                    </label>
                    <p class="config-description">
                        Enter your OpenAI API key to access GPT models.
                        <a href="https://platform.openai.com/api-keys" target="_blank" class="link">Get API Key →</a>
                    </p>
                    <div class="input-with-toggle">
                        <input #openaiKeyInput [type]="showApiKey ? 'text' : 'password'" [(ngModel)]="openaiApiKey"
                            class="config-input" placeholder="sk-..." />
                        <button class="toggle-visibility-btn" (click)="toggleShowApiKey()" type="button">
                            {{ showApiKey ? '🙈' : '👁️' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="cancel-btn" (click)="onClose()">Cancel</button>
            <button class="save-btn" (click)="saveConfig()" [disabled]="isSaving">
                {{ isSaving ? 'Saving...' : 'Save Configuration' }}
            </button>
        </div>
    </div>
</div>
